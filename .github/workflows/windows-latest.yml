name: Windows Qt 6.12

on:
  push:
    # qt6 is the branch that carries the Qt 6 port: the generator build, the
    # regeneration and the binding tests must run on every push to it.
    branches: [main, qt6]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: '6.12.0'
  QT_ARCH: 'win64_msvc2022_64'
  QT_ARTIFACT_ID: 'windows-msvc2022'
  QTSCRIPT_REF: 'main'

concurrency:
  group: windows-612-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Qt 6.12 MSVC 2026 (Release)
    # windows-2025-vs2026 ships Visual Studio 2026 (MSVC toolset 14.51), so
    # vswhere -latest in build.ps1, build-generator.ps1 and
    # qtscript-qt6/scripts/build-windows.ps1 selects the MSVC 2026 compiler.
    # This reproduces issue #13's toolset for the generator, the QtScript
    # engine and the bindings, and the smoke suite
    # (tests/core-encoding-validation-smoke.js) covers the caught-throw ->
    # QObject receiver cast regression.
    runs-on: windows-2025-vs2026
    timeout-minutes: 60

    steps:
      - name: Check out bindings
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check out QtScript port
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: JulienMaille/qtscript-qt6
          ref: ${{ env.QTSCRIPT_REF }}
          path: qtscript-qt6
          submodules: true

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: ${{ env.QT_ARCH }}
          cache: true
          cache-key-prefix: 'qt-${{ env.QT_VERSION }}-aqt-16db45a-v1'
          # Use a tested checksum-enabled aqtinstall snapshot (3.3.x lacks
          # checksum entries for recent Qt Windows archives).
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'

      - name: Build QtScript dependency
        shell: pwsh
        env:
          QTSCRIPT_ROOT: ${{ github.workspace }}\qtscript-qt6
          QSCRIPT_WORK_ROOT: ${{ runner.temp }}\qtscript-work
        run: >-
          & "$env:QTSCRIPT_ROOT\scripts\build-windows.ps1"
          -QtRoot $env:QT_ROOT_DIR
          -WorkRoot $env:QSCRIPT_WORK_ROOT
          -Configuration Release
          -Parallel 4

      - name: Build generator
        shell: pwsh
        run: .\generator\build-generator.ps1 -QtPrefix $env:QT_ROOT_DIR -Configuration Release

      - name: Generate the binding projects
        shell: pwsh
        # The generator produces the nine binding projects on every run: no
        # generated_cpp/ is tracked any more, so the build consumes what this
        # step just generated. The curated pass re-attaches the
        # hand-maintained, non-generatable sources of generator/curated/
        # before the projects are published where CMake reads them.
        run: >-
          .\generator\regen-all.ps1
          -QtPrefix $env:QT_ROOT_DIR
          -OutputRoot ${env:GITHUB_WORKSPACE}\regen-test
          -ApplyCurated
          -PublishRoot $env:GITHUB_WORKSPACE

      - name: Check the reject budget
        shell: pwsh
        # The reject budget was seeded once and for all from Qt 6.12 and Qt
        # 6.8.3 logs (tools/reject-budget.ps1 -Update, "the larger count wins").
        # A count that grows here means a member this CI just lost: fail before
        # the build instead of shipping bindings with a hole.
        run: .\tools\reject-budget.ps1 -LogRoot ${env:GITHUB_WORKSPACE}\regen-test\logs

      - name: Build bindings
        shell: pwsh
        run: .\build.ps1 -QtPrefix $env:QT_ROOT_DIR -Configuration Release

      - name: Run binding smoke tests
        shell: pwsh
        run: .\test.ps1 -QtPrefix $env:QT_ROOT_DIR -Configuration Release -EvaluatorTimeoutMilliseconds 120000

      - name: Upload Release bindings
        # A red run is exactly the one whose artifacts are wanted: keep them.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qtscriptgenerator-qt${{ env.QT_VERSION }}-${{ env.QT_ARTIFACT_ID }}-Release
          path: |
            plugins/script/*.dll
            qtbindings/qs_eval/release/qs_eval.exe
          if-no-files-found: error
          retention-days: 3

      - name: Upload generated projects
        # Kept on failure too: comparing the generated tree of one Qt version
        # against another is how a cross-version generation difference is
        # diagnosed. The reject logs travel with it, one directory per module:
        # they are what explains a difference in the tree, and the per-module
        # budget the gate reads is built from them.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qtscriptgenerator-qt${{ env.QT_VERSION }}-generated-cpp
          path: |
            generated_cpp/**
            regen-test/qtbindings/**
            regen-test/logs/**
          if-no-files-found: error
          retention-days: 3
